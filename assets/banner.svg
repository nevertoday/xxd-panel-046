<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 046</title>
  <desc>Bright impasto micro-landscapes, source-derived diagonal fields, warm-white space, delicate typography, and five-language documentation.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF5"/>
      <stop offset="0.58" stop-color="#FFF8E8"/>
      <stop offset="1" stop-color="#F5EEDC"/>
    </linearGradient>
    <linearGradient id="swash" x1="695" y1="330" x2="1130" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BFD1"/>
      <stop offset="0.34" stop-color="#6ED6B0"/>
      <stop offset="0.68" stop-color="#FFD35F"/>
      <stop offset="1" stop-color="#FF805F"/>
    </linearGradient>
    <linearGradient id="miniature" x1="870" y1="122" x2="995" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB95A"/>
      <stop offset="0.48" stop-color="#F47C62"/>
      <stop offset="1" stop-color="#C94E7A"/>
    </linearGradient>
    <pattern id="fiber" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M3 8L12 6M28 31L37 29M8 37L16 35" stroke="#6C5948" stroke-opacity="0.045"/>
      <circle cx="23" cy="15" r="0.7" fill="#4AAFC1" fill-opacity="0.08"/>
    </pattern>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#7D6550" flood-opacity="0.18"/>
    </filter>
    <filter id="paintEdge" x="-20%" y="-30%" width="140%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025 0.09" numOctaves="2" seed="46" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#paper)"/>
    <rect width="1200" height="400" fill="url(#fiber)"/>
    <circle cx="1125" cy="18" r="190" fill="#FFD45A" fill-opacity="0.1"/>
    <circle cx="1025" cy="355" r="150" fill="#4CC4D0" fill-opacity="0.08"/>
  </g>
  <rect x="22" y="22" width="1156" height="356" rx="22" stroke="#39332C" stroke-opacity="0.16"/>

  <text x="1036" y="43" text-anchor="end" fill="#4C443C" fill-opacity="0.62" font-family="Arial, sans-serif" font-size="12" font-weight="700">中文 · EN · 日本語 · 한국어 ·</text>
  <text x="1128" y="43" text-anchor="end" direction="rtl" fill="#4C443C" fill-opacity="0.62" font-family="Arial, sans-serif" font-size="12" font-weight="700">العربية</text>

  <g>
    <rect x="72" y="62" width="202" height="34" rx="17" fill="#2E2B27"/>
    <text x="92" y="84" fill="#FFFDF5" font-family="Arial" font-size="14" font-weight="800" letter-spacing="2">XXD / IMAGE SKILL</text>
    <text x="70" y="165" fill="#292622" font-family="Arial" font-size="65" font-weight="900" letter-spacing="-2">PANEL <tspan fill="#E85F59">046</tspan></text>
    <text x="72" y="210" fill="#2F9FB4" font-family="Arial" font-size="23" font-weight="850" letter-spacing="0.6">BRIGHT IMPASTO · MICRO LANDSCAPE</text>
    <text x="72" y="246" fill="#4F4840" font-family="sans-serif" font-size="18" font-weight="650">明亮厚涂 × 微缩实体 × 清透光感</text>
    <text x="72" y="273" fill="#4F4840" fill-opacity="0.76" font-family="sans-serif" font-size="15" font-weight="600">明るい厚塗りの小景観 · 밝은 임파스토 미니어처 풍경</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="72" y="303" width="143" height="42" rx="9" fill="#FFFDF5" stroke="#39332C" stroke-opacity="0.18"/>
    <text x="92" y="330" fill="#302C28" font-family="Menlo" font-size="13" font-weight="800">SOURCE-BOUND</text>
    <rect x="227" y="303" width="132" height="42" rx="9" fill="#E85F59"/>
    <text x="248" y="330" fill="#FFFDF5" font-family="Menlo" font-size="13" font-weight="800">4 MODES</text>
    <rect x="371" y="303" width="175" height="42" rx="9" fill="#2F9FB4"/>
    <text x="392" y="330" fill="#FFFDF5" font-family="Menlo" font-size="13" font-weight="800">WALLPAPER PACK</text>
  </g>

  <g filter="url(#softShadow)">
    <path d="M674 309C746 270 805 251 864 214C936 169 1010 114 1131 72C1070 134 1001 208 930 256C847 313 773 334 688 349Z" fill="url(#swash)" filter="url(#paintEdge)"/>
    <path d="M715 319C809 274 880 235 962 173C1007 139 1053 108 1111 87" stroke="#FFFDF5" stroke-opacity="0.56" stroke-width="7" stroke-linecap="round"/>
    <path d="M740 326C828 292 916 240 1001 168" stroke="#267F9D" stroke-opacity="0.32" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(918 197)" filter="url(#softShadow)">
    <path d="M-83 55L-44 -15L2 -57L52 -18L88 59L27 82L-45 79Z" fill="url(#miniature)"/>
    <path d="M-64 51L-28 3L5 -26L38 -2L65 52L21 67L-37 65Z" fill="#FFD45F" fill-opacity="0.66"/>
    <path d="M-23 64V16H30V66" fill="#FFF8E8" fill-opacity="0.92"/>
    <path d="M-30 18L3 -10L38 18" stroke="#B94E61" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-7" y="35" width="18" height="31" rx="3" fill="#36A6BD"/>
    <circle cx="-84" cy="-15" r="22" fill="#FFFDF5" stroke="#FFD45F" stroke-width="10"/>
    <path d="M-95 -15H-73M-84 -26V-4" stroke="#FF805F" stroke-width="4" stroke-linecap="round"/>
    <path d="M-92 70C-49 88 22 91 96 61" stroke="#FFFDF5" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(688 285)">
    <text x="0" y="-15" fill="#4F4840" fill-opacity="0.62" font-family="Georgia, serif" font-size="11" font-weight="700" letter-spacing="1.4">PALETTE-KNIFE LIGHT / VOL.046</text>
    <path d="M1 2H190" stroke="#4F4840" stroke-opacity="0.25"/>
    <text x="0" y="24" fill="#4F4840" fill-opacity="0.72" font-family="Georgia, serif" font-size="13" font-style="italic">colour rises gently from the paper</text>
  </g>
</svg>
